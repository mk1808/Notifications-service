server:
  port: 8082
  
spring:
  application:
    name: "userInterface"

management:
  endpoints:
    web:
      exposure:
        include:
        - "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true	
  instance:
    instance-id: ${spring.application.name}:${random.value}
    preferIpAddress: true
    lease-renewal-interval-in-seconds: 2
    lease-expiration-duration-in-seconds: 5

info:
  app:
    name: "UserInterface"
    description: "User Interface microservice - UI provider"
    version: "1.0.0"